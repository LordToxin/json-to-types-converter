<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeForge Pro | JSON to Multi-Language Type & Schema Synthesizer</title>
  <meta name="description" content="Instant JSON to TypeScript, Go, Rust Serde, Python Pydantic, C#, and JSON Schema synthesizer with interactive AST inspector.">
  <meta property="og:title" content="TypeForge Pro - JSON to Multi-Language Schema & Type Generator">
  <meta property="og:description" content="Convert JSON payloads into robust, production-grade types for TypeScript, Go, Rust, Python, and C# in real time.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <div>
        <div class="brand-title">
          TypeForge Pro
          <span class="brand-tag">Multi-Lang</span>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 8px;">
      <button id="copy-code-btn" class="btn btn-primary" title="Copy generated code">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copy Types
      </button>
      <button id="download-code-btn" class="btn btn-secondary" title="Download model file">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download File
      </button>
    </div>
  </header>

  <!-- Pre-loaded API Samples Bar -->
  <div class="samples-bar">
    <span class="samples-label">API Payloads:</span>
    <button class="sample-chip active" data-sample="ecommerceOrder">E-Commerce Order</button>
    <button class="sample-chip" data-sample="githubRepo">GitHub Repository</button>
    <button class="sample-chip" data-sample="stripePayment">Stripe Payment Intent</button>
  </div>

  <!-- Workspace Split -->
  <div class="workspace-split">
    <!-- Left: JSON Input -->
    <div class="editor-pane">
      <div class="pane-toolbar">
        <span class="pane-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          JSON Payload Input
        </span>
        <div class="editor-actions">
          <button id="beautify-btn" class="btn btn-secondary" title="Format JSON">Format</button>
          <button id="minify-btn" class="btn btn-secondary" title="Compact JSON">Minify</button>
          <button id="clear-btn" class="btn btn-secondary" title="Clear Editor">Clear</button>
        </div>
      </div>
      <textarea id="json-input" class="code-editor" spellcheck="false" placeholder="Paste your raw JSON payload here..."></textarea>
      <div id="error-banner" class="error-banner hidden"></div>
    </div>

    <!-- Right: Generated Code Output -->
    <div class="output-pane">
      <div class="pane-toolbar">
        <div class="lang-tabs">
          <button class="lang-tab-btn active" data-lang="typescript">TypeScript</button>
          <button class="lang-tab-btn" data-lang="go">Go</button>
          <button class="lang-tab-btn" data-lang="rust">Rust (Serde)</button>
          <button class="lang-tab-btn" data-lang="python">Python (Pydantic)</button>
          <button class="lang-tab-btn" data-lang="csharp">C#</button>
          <button class="lang-tab-btn" data-lang="schema">JSON Schema</button>
          <button class="lang-tab-btn" data-lang="mock">Mock Data</button>
        </div>

        <div style="display: flex; align-items: center; gap: 6px;">
          <label class="text-xs text-slate-400" for="root-name-input">Root Name:</label>
          <input type="text" id="root-name-input" class="root-name-input" value="OrderResponse">
        </div>
      </div>
      <pre id="code-output" class="code-view">// Generating types...</pre>
    </div>
  </div>

  <!-- Bottom: Tree View & Stats Inspector -->
  <div class="inspector-section">
    <div class="inspector-header">
      <span class="pane-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"></polyline><line x1="1" y1="3" x2="23" y2="3"></line><line x1="10" y1="12" x2="14" y2="12"></line></svg>
        AST Schema & Key Hierarchy
      </span>
      <div class="stats-group">
        <span class="stat-pill">Total Keys: <strong id="stat-keys">0</strong></span>
        <span class="stat-pill">Max Depth: <strong id="stat-depth">0</strong></span>
        <span class="stat-pill">Payload Size: <strong id="stat-size">0 B</strong></span>
      </div>
    </div>

    <div id="schema-tree-container" class="tree-container">
      <!-- Injected via app.js -->
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Scripts -->
  <script src="js/type-generator.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
